[project]
name = "shopytics"
version = "0.1.0"
requires-python = "==3.13.5"
dependencies = [
    "pandas==2.3.1",
    "numpy==2.3.1",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "matplotlib==3.10.7",
    "umap-learn==0.6.0",
    "numba==0.68.1",
    "jupyter==1.1.1",
    "ipykernel==7.1.0",
    "nbformat==5.10.4",
    "nbconvert==7.16.6",
]

[dependency-groups]
dev = [
    "google-colab-cli>=0.8.0",
    "keyrings-alt>=5.0.2",
    "pytest==9.2.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shopytics"
module-root = ""
